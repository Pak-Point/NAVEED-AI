<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="NAVEED AI - your personal Urdu, Saraiki and English assistant.">
  <title>NAVEED AI</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#101d30;--line:#20334b;--cyan:#43d9ee;--muted:#9aacc2}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#15385a 0,transparent 55%),var(--bg);color:#f4f8ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
    .app{max-width:760px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
    header{display:flex;align-items:center;gap:12px;padding:20px 4px 16px;border-bottom:1px solid var(--line)}
    .logo{width:42px;height:42px;border:1px solid #2a7891;border-radius:14px;display:grid;place-items:center;color:var(--cyan);font-weight:900;box-shadow:0 0 22px #28c9e733}
    h1{font-size:18px;letter-spacing:2px;margin:0}header p{margin:3px 0 0;color:var(--muted);font-size:12px}.status{margin-left:auto;color:#79e4b0;font-size:11px}
    #messages{flex:1;overflow:auto;padding:20px 2px 14px;display:flex;flex-direction:column;gap:14px}
    .welcome{text-align:center;margin:auto 0;color:var(--muted);padding:24px 8px}.orb{width:106px;height:106px;border-radius:50%;margin:0 auto 20px;border:1px solid #2a9bb7;display:grid;place-items:center;color:var(--cyan);font-size:36px;box-shadow:0 0 35px #24c9e933,inset 0 0 30px #24c9e91c}.welcome h2{color:#f4f8ff;font-size:22px;margin:0 0 8px}.welcome p{line-height:1.6;font-size:14px}
    .msg{max-width:88%;padding:12px 14px;border-radius:17px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}.user{align-self:flex-end;background:#123b55;border:1px solid #21617c;border-bottom-right-radius:5px}.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}.error{color:#ffb4b4}
    .composer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 18%);padding:12px 0 calc(14px + env(safe-area-inset-bottom))}
    .tools{display:flex;gap:8px;margin-bottom:9px;align-items:center}.tools select{background:#0d1a2b;color:#dceafa;border:1px solid var(--line);border-radius:12px;padding:9px;flex:1}
    .inputrow{display:flex;gap:8px;background:#0d1a2b;border:1px solid #29435d;border-radius:18px;padding:7px}.inputrow textarea{flex:1;resize:none;min-height:42px;max-height:130px;background:transparent;border:0;outline:0;color:white;padding:10px;font:inherit}.btn{border:1px solid var(--line);background:#14263b;color:#eaf8ff;border-radius:13px;padding:0 13px;min-width:45px;font-size:18px}.send{background:#087f9b;border-color:#16a8c6;font-size:14px;font-weight:700}.btn:disabled{opacity:.45}.hint{text-align:center;color:#71869f;font-size:11px;margin-top:9px}
    button{cursor:pointer}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
    @media(min-width:600px){.app{padding-left:24px;padding-right:24px}}
  </style>
</head>
<body>
<div class="app">
  <header><div class="logo">N</div><div><h1>NAVEED AI</h1><p>Your Personal AI Assistant</p></div><div class="status">● Ready</div></header>
  <main id="messages" aria-live="polite">
    <section class="welcome" id="welcome"><div class="orb">✧</div><h2>Assalam-o-Alaikum!</h2><p>Main NAVEED AI hoon. Aap Urdu, Roman Urdu, Saraiki ya English mein sawal likh ya bol sakte hain.</p></section>
  </main>
  <section class="composer">
    <div class="tools">
      <select id="language" aria-label="Reply language"><option value="same">Reply in my language</option><option value="Urdu">اردو</option><option value="Roman Urdu">Roman Urdu</option><option value="Saraiki">Saraiki</option><option value="English">English</option></select>
      <button class="btn" id="speakToggle" title="Voice replies on/off" aria-label="Toggle voice replies">🔊</button>
      <button class="btn" id="clear" title="New chat" aria-label="New chat">↻</button>
    </div>
    <div class="inputrow"><button class="btn" id="mic" title="Speak" aria-label="Speak">🎙️</button><textarea id="prompt" rows="1" placeholder="Message NAVEED AI..."></textarea><button class="btn send" id="send">Send</button></div>
    <div class="hint" id="hint">Voice input depends on your browser's speech recognition support.</div>
  </section>
</div>
<script>
const API_URL='https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev';
const messagesEl=document.getElementById('messages'),promptEl=document.getElementById('prompt'),sendBtn=document.getElementById('send'),micBtn=document.getElementById('mic'),hint=document.getElementById('hint');
let history=[],voiceReplies=true,recognition=null;
function addMessage(text,who,extra=''){document.getElementById('welcome')?.remove();const el=document.createElement('div');el.className='msg '+who+(extra?' '+extra:'');el.textContent=text;messagesEl.appendChild(el);messagesEl.scrollTop=messagesEl.scrollHeight;return el}
function speak(text){if(!voiceReplies||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const lang=document.getElementById('language').value;u.lang=lang==='English'?'en-US':lang==='Urdu'?'ur-PK':'ur-PK';speechSynthesis.speak(u)}
async function send(){const text=promptEl.value.trim();if(!text)return;promptEl.value='';addMessage(text,'user');const loading=addMessage('Soch raha hoon…','bot');sendBtn.disabled=true;micBtn.disabled=true;
try{if(API_URL.includes('YOUR-WORKER-NAME'))throw new Error('Cloudflare Worker abhi connect nahi hua. Worker deploy karke API_URL set karein.');const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:history.slice(-10),language:document.getElementById('language').value})});const raw=await res.text();let data={};try{data=raw?JSON.parse(raw):{}}catch{throw new Error('Server ne valid JSON jawab nahi diya (HTTP '+res.status+'). Mumkin hai function timeout ya deploy issue ho.')}if(!res.ok)throw new Error(data.error||('Server error (HTTP '+res.status+').'));if(!data.reply)throw new Error(data.error||'Gemini se khali jawab mila.');loading.textContent=data.reply;history.push({role:'user',text},{role:'assistant',text:data.reply});speak(data.reply)}catch(e){loading.textContent='Maazrat, abhi jawab nahi mil saka: '+(e.message||'Network error');loading.classList.add('error')}finally{sendBtn.disabled=false;micBtn.disabled=false;promptEl.focus()}}
sendBtn.addEventListener('click',send);promptEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
document.getElementById('speakToggle').addEventListener('click',e=>{voiceReplies=!voiceReplies;e.currentTarget.textContent=voiceReplies?'🔊':'🔇';if(!voiceReplies&&'speechSynthesis'in window)speechSynthesis.cancel()});
document.getElementById('clear').addEventListener('click',()=>{history=[];messagesEl.innerHTML='<section class="welcome" id="welcome"><div class="orb">✧</div><h2>Assalam-o-Alaikum!</h2><p>New chat started. Aap kya poochna chahte hain?</p></section>'});
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SpeechRecognition){recognition=new SpeechRecognition();recognition.lang='ur-PK';recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onstart=()=>{micBtn.textContent='⏺️';hint.textContent='Sun raha hoon… boliye';};recognition.onend=()=>{micBtn.textContent='🎙️';hint.textContent='Awaaz band. Apna message bhejein.'};recognition.onresult=e=>{promptEl.value=e.results[0][0].transcript;send()};recognition.onerror=e=>{hint.textContent='Voice error: '+e.error+'. Aap text type kar sakte hain.'};micBtn.addEventListener('click',()=>{try{recognition.start()}catch(e){hint.textContent='Microphone pehle se active hai.'}})}else{micBtn.disabled=true;hint.textContent='Is browser mein voice input supported nahi. Chrome mein try karein.'}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
